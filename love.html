<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12061f;color:#fff;
font-family:-apple-system,"PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(circle at 50% 20%,rgba(255,60,130,.25),transparent 60%),
radial-gradient(circle at 20% 80%,rgba(150,70,255,.2),transparent 60%)}

.s{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:32px;text-align:center;
opacity:0;pointer-events:none;transition:opacity .9s ease}
.s.in{opacity:1;pointer-events:auto}

.dlg{width:100%;max-width:520px;display:flex;flex-direction:column;
gap:30px;align-items:center;position:absolute}
.sent{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.sent .t{font-size:21px;line-height:1.65;font-weight:300;
color:rgba(255,255,255,.95);text-shadow:0 0 22px rgba(255,110,170,.45);
opacity:0;transform:translateY(16px);
transition:opacity .9s ease,transform .9s ease;
word-break:break-all}
.sent .t.on{opacity:1;transform:none}

.h{font-size:80px;line-height:1;filter:drop-shadow(0 0 24px rgba(255,60,120,.8));
animation:b 1.2s ease-in-out infinite}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.tap{margin-top:34px;font-size:14px;letter-spacing:.35em;text-indent:.35em;
color:rgba(255,255,255,.55);animation:f 2s infinite}
@keyframes f{50%{opacity:.3}}

.q1{font-size:42px;font-weight:700;letter-spacing:.05em;
background:linear-gradient(135deg,#ffe0ee,#ff5c9d 45%,#c86bff);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 28px rgba(255,80,150,.6))}
.q2{margin-top:22px;font-size:18px;font-weight:300;line-height:1.8;
color:rgba(255,255,255,.82);letter-spacing:.05em}
.btns{margin-top:56px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:nowrap}
button{font-family:inherit;border:none;border-radius:999px;
padding:15px 32px;font-size:17px;cursor:pointer;-webkit-appearance:none;
transition:transform .4s cubic-bezier(.2,1.3,.5,1),opacity .4s,box-shadow .4s}
#yes{background:linear-gradient(135deg,#ff5f9e,#ff2d6f);color:#fff;
font-weight:600;letter-spacing:.08em;animation:g 2s ease-in-out infinite}
@keyframes g{0%,100%{box-shadow:0 10px 30px rgba(255,45,111,.4),0 0 0 0 rgba(255,90,150,.55)}
50%{box-shadow:0 10px 40px rgba(255,45,111,.75),0 0 0 16px rgba(255,90,150,0)}}
#no{background:rgba(255,255,255,.07);color:rgba(255,255,255,.62);
border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- 燃烧的蜡烛 ---------- */
.candle{
  position:relative;
  width:36px;height:110px;
  margin-bottom:6px;
  display:flex;flex-direction:column;align-items:center;
}
/* 烛身 */
.candle .body{
  position:absolute;bottom:0;
  width:36px;height:80px;
  border-radius:8px 8px 6px 6px;
  background:linear-gradient(180deg,#fff6ec 0%,#ffe6d2 45%,#f7cdb0 100%);
  box-shadow:inset -6px 0 10px rgba(200,140,110,.35),
             inset 6px 0 8px rgba(255,255,255,.7),
             0 0 30px rgba(255,180,120,.35);
}
/* 蜡烛顶部的凹陷 */
.candle .body::before{
  content:'';position:absolute;top:-5px;left:50%;
  transform:translateX(-50%);
  width:26px;height:8px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#f3c9a8,#ffe9d6 70%);
}
/* 烛芯 */
.candle .wick{
  position:absolute;bottom:78px;left:50%;
  transform:translateX(-50%);
  width:2.5px;height:12px;
  border-radius:2px;
  background:#3a2a22;
  z-index:2;
}
/* 火焰光晕 */
.candle .glow{
  position:absolute;bottom:78px;left:50%;
  transform:translateX(-50%);
  width:120px;height:120px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,170,80,.4) 0%,rgba(255,120,60,.16) 40%,transparent 70%);
  animation:glowPulse 2.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glowPulse{
  0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}
  50%{opacity:1;transform:translateX(-50%) scale(1.12)}
}
/* 火焰 */
.candle .flame{
  position:absolute;bottom:86px;left:50%;
  transform-origin:50% 90%;
  width:20px;height:38px;
  margin-left:-10px;
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,
    #fff8d6 0%,#ffe27a 28%,#ffb23e 55%,#ff7a2e 78%,#e8481f 100%);
  box-shadow:0 0 18px rgba(255,180,80,.9),0 0 36px rgba(255,120,40,.55);
  animation:flicker 1.5s ease-in-out infinite;
  z-index:3;
}
/* 火焰内芯 */
.candle .flame::after{
  content:'';position:absolute;bottom:5px;left:50%;
  transform:translateX(-50%);
  width:8px;height:14px;
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fffdf2,#ffe9a8 80%);
  opacity:.9;
}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(-1deg)}
  25%{transform:scale(1.06,.96) rotate(1.5deg)}
  50%{transform:scale(.96,1.05) rotate(-1.5deg)}
  75%{transform:scale(1.04,.98) rotate(1deg)}
}

.f1{margin-top:22px;font-size:32px;font-weight:700;letter-spacing:.06em;
background:linear-gradient(135deg,#ffe0ee,#ff5c9d 50%,#c86bff);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 24px rgba(255,80,150,.55))}
.f2{margin-top:20px;font-size:17px;line-height:1.9;font-weight:300;
color:rgba(255,255,255,.85)}
.f3{margin-top:34px;font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.4)}
</style>
</head>
<body>

<!-- ① 开场 -->
<div class="s in" id="s1">
  <div class="h">🎂</div>
  <p class="tap">轻 触 屏 幕</p>
</div>

<!-- ② 对话区 -->
<div class="s" id="s2"></div>

<!-- ③ 表白 -->
<div class="s" id="s3">
  <h1 class="q1">生日快乐 🎂</h1>
  <p class="q2">偷偷告诉你：我喜欢你<br>如果可以，想从认识你开始</p>
  <div class="btns">
    <button id="yes">开心收下 💕</button>
    <button id="no">先当朋友呀</button>
  </div>
</div>

<!-- ④ 结尾 -->
<div class="s" id="s4">
  <div class="candle">
    <div class="glow"></div>
    <div class="flame"></div>
    <div class="wick"></div>
    <div class="body"></div>
  </div>
  <div class="f1">谢谢你</div>
  <p class="f2" id="ft"></p>
  <p class="f3" id="fd"></p>
</div>

<audio id="m" loop src="piano.mp3"></audio>

<script>
/* ========== 可修改文案 ========== */
const SCENES = [
  ['嘿，生日快乐',
   '这句话，我在心里想了好久'],

  ['我们其实还不算熟',
   '但每次在教学楼遇见你',
   '我都会忍不住多看一眼',
   '心跳也悄悄漏了一拍'],

  ['一直没敢主动走近你',
   '怕打扰你，也怕你嫌我烦',
   '但今天是你生日',
   '我想勇敢一次'],

  ['祝你生日快乐',
   '愿你每天都开开心心',
   '还有一句藏在心里的话',
   '我喜欢你']
];

const MAX_PER_LINE = 10;
const GAP_AFTER_SENT  = 900;
const GAP_AFTER_SCENE = 1200;

const FINAL_TEXT = '今天是你生日，希望你开心<br>如果可以，我想从认识你开始。';
const NO_TEXTS = ['先当朋友呀','真的不再想想？','没关系，不着急','生日快乐最重要','那就……先这样','祝你天天开心 😊'];
/* ================================= */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let started = false, noCount = 0;

function playMusic(){
  const a = $('m');
  a.volume = .35;
  a.play().catch(()=>{});
}

function splitLines(text, max){
  const out = [];
  for(let i = 0; i < text.length; i += max){
    out.push(text.slice(i, i + max));
  }
  return out;
}

async function go(){
  if(started) return;
  started = true;
  playMusic();

  $('s1').classList.remove('in');
  await sleep(700);
  $('s1').style.display = 'none';

  const s2 = $('s2');
  s2.classList.add('in');

  for(let i = 0; i < SCENES.length; i++){
    const lines = SCENES[i];

    const box = document.createElement('div');
    box.className = 'dlg';
    s2.appendChild(box);

    for(const line of lines){
      const sent = document.createElement('div');
      sent.className = 'sent';

      const subs = splitLines(line, MAX_PER_LINE);
      const els = subs.map(sub => {
        const p = document.createElement('p');
        p.className = 't';
        p.textContent = sub;
        sent.appendChild(p);
        return p;
      });

      box.appendChild(sent);
      await sleep(80);
      els.forEach(el => el.classList.add('on'));
      await sleep(GAP_AFTER_SENT);
    }

    await sleep(GAP_AFTER_SCENE);

    box.style.transition = 'opacity .8s ease';
    box.style.opacity = '0';
    await sleep(850);
    box.remove();
  }

  s2.classList.remove('in');
  await sleep(800);
  s2.style.display = 'none';
  $('s3').classList.add('in');
}

$('s1').addEventListener('pointerdown', go);
document.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter') go();
});

$('no').addEventListener('click', function(){
  noCount++;
  this.textContent = NO_TEXTS[Math.min(noCount, NO_TEXTS.length - 1)];
  const ns = Math.max(.28, 1 - noCount * .14);
  this.style.transform = `scale(${ns})`;
  this.style.opacity = String(Math.max(.2, 1 - noCount * .14));
  $('yes').style.transform = `scale(${1 + Math.min(noCount * .11, .6)})`;
  if(noCount >= 6){
    this.style.opacity = '0';
    this.style.pointerEvents = 'none';
  }
});

$('yes').addEventListener('click', async () => {
  const q = $('s3');
  q.classList.remove('in');
  await sleep(700);
  q.style.display = 'none';

  const d = new Date();
  $('ft').innerHTML = FINAL_TEXT;
  $('fd').textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 祝你生日快乐`;

  $('s4').classList.add('in');
});
</script>
</body>
</html>
