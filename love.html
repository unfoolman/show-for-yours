<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12061f">
<title>给你</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#12061f;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,60,130,.22), transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(150,70,255,.18), transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(255,120,180,.14), transparent 55%);
  }
  #bg{position:fixed;inset:0;display:block;z-index:0}
  #stage{position:fixed;inset:0;z-index:1}

  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;text-align:center;
    opacity:0;pointer-events:none;transform:scale(.96);
    transition:opacity .8s ease, transform .8s ease;
  }
  .scene.in{opacity:1;pointer-events:auto;transform:scale(1)}
  .scene.out{opacity:0;transform:scale(1.06)}

  /* 音乐开关 */
  #musicBtn{
    position:fixed;top:18px;right:18px;z-index:20;
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .6s,transform .4s;
  }
  #musicBtn.off{opacity:.35}
  #musicBtn:active{transform:scale(.9)}

  /* ---------- 开场 ---------- */
  #intro{cursor:pointer}
  .heart-wrap{
    width:112px;height:112px;
    filter:drop-shadow(0 0 30px rgba(255,60,120,.9));
    animation:beat 1.15s ease-in-out infinite;
  }
  .heart-wrap svg{width:100%;height:100%;display:block}
  @keyframes beat{
    0%,100%{transform:scale(1)}
    14%{transform:scale(1.18)}
    28%{transform:scale(1)}
    42%{transform:scale(1.12)}
    56%{transform:scale(1)}
  }
  .tap-hint{
    margin-top:36px;font-size:14px;letter-spacing:.36em;text-indent:.36em;
    color:rgba(255,255,255,.6);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* ---------- 理由列表 ---------- */
  #reasons{justify-content:flex-start;padding-top:14vh}
  .reason{
    width:100%;max-width:520px;
    margin-bottom:26px;
    opacity:0;transform:translateY(22px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .reason.show{opacity:1;transform:translateY(0)}
  .reason .num{
    font-size:13px;letter-spacing:.3em;
    color:rgba(255,140,190,.85);
    margin-bottom:8px;
  }
  .reason .txt{
    font-size:19px;line-height:1.7;font-weight:300;
    color:rgba(255,255,255,.95);
    text-shadow:0 0 22px rgba(255,110,170,.45);
  }
  .reason .line{
    width:34px;height:1px;margin:14px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,120,180,.7),transparent);
  }

  /* ---------- 提问 ---------- */
  .q-title{
    font-size:46px;font-weight:700;letter-spacing:.05em;
    background:linear-gradient(135deg,#ffe0ee,#ff5c9d 45%,#c86bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,80,150,.6));
  }
  .q-sub{
    margin-top:22px;font-size:18px;font-weight:300;
    color:rgba(255,255,255,.82);letter-spacing:.05em;
  }
  .btns{
    margin-top:56px;display:flex;gap:14px;align-items:center;justify-content:center;
    flex-wrap:nowrap;
  }
  button{
    font-family:inherit;border:none;border-radius:999px;
    padding:15px 32px;font-size:17px;cursor:pointer;
    -webkit-appearance:none;
    transition:transform .4s cubic-bezier(.2,1.3,.5,1),opacity .4s,box-shadow .4s;
  }
  #yes{
    background:linear-gradient(135deg,#ff5f9e,#ff2d6f);
    color:#fff;font-weight:600;letter-spacing:.08em;
    animation:pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 10px 30px rgba(255,45,111,.4),0 0 0 0 rgba(255,90,150,.55)}
    50%{box-shadow:0 10px 40px rgba(255,45,111,.75),0 0 0 16px rgba(255,90,150,0)}
  }
  #no{
    background:rgba(255,255,255,.07);color:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }

  /* ---------- 结尾 ---------- */
  .final-heart{
    font-size:56px;line-height:1;
    filter:drop-shadow(0 0 26px rgba(255,60,120,.85));
    animation:beat 1.3s ease-in-out infinite;
  }
  .f1{
    margin-top:26px;font-size:34px;font-weight:700;letter-spacing:.06em;
    background:linear-gradient(135deg,#ffe0ee,#ff5c9d 50%,#c86bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(255,80,150,.55));
  }
  .f2{
    margin-top:20px;font-size:17px;line-height:1.9;font-weight:300;
    color:rgba(255,255,255,.85);
  }
  .f3{
    margin-top:34px;font-size:13px;letter-spacing:.1em;
    color:rgba(255,255,255,.4);
  }

  /* ---------- 爱心爆炸 ---------- */
  .burst{
    position:fixed;left:50%;top:50%;z-index:9;
    pointer-events:none;will-change:transform,opacity;
    animation:burstFly 1.7s cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes burstFly{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    12%{opacity:1}
    100%{
      transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty)))
                scale(1.15) rotate(var(--rot));
      opacity:0;
    }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- 音乐开关 -->
<div id="musicBtn" class="off">♪</div>

<div id="stage">

  <!-- ① 开场 -->
  <div class="scene in" id="intro">
    <div class="heart-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff7ab8"/>
            <stop offset="55%" stop-color="#ff3d78"/>
            <stop offset="100%" stop-color="#c14bff"/>
          </linearGradient>
        </defs>
        <path fill="url(#hg)"
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <p class="tap-hint">轻 触 屏 幕</p>
  </div>

  <!-- ② 喜欢你的理由 -->
  <div class="scene" id="reasons"></div>

  <!-- ③ 提问 -->
  <div class="scene" id="question">
    <h1 class="q-title">我喜欢你</h1>
    <p class="q-sub">可以做我女朋友吗？</p>
    <div class="btns">
      <button id="yes">愿意 💕</button>
      <button id="no">再想想</button>
    </div>
  </div>

  <!-- ④ 结尾 -->
  <div class="scene" id="final">
    <div class="final-heart">❤</div>
    <h1 class="f1">谢谢你</h1>
    <p class="f2" id="finalText"></p>
    <p class="f3" id="dateLine"></p>
  </div>

</div>

<!-- 背景音乐：轻钢琴循环（外链，需联网） -->
<audio id="bgm" loop preload="auto" playsinline webkit-playsinline>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_3c6c3f2b3c.mp3?filename=relaxing-piano-110849.mp3" type="audio/mpeg">
</audio>

<script>
/* =========================================================
   可自由修改的文案区
   ========================================================= */

/* ① 开场后的几句铺垫（可删可改） */
const LINES = [
  { t: '嘿，是我。',                    s: 130, p: 900 },
  { t: '有些话，我在心里念了很多遍。',   s: 85,  p: 800 },
  { t: '今天，我想认真地告诉你——',       s: 85,  p: 700 },
];

/* ② 喜欢你的理由（每条独立出现，最重要！） */
const REASONS = [
  '我喜欢你笑起来的样子，像整个房间都亮了。',
  '我喜欢你认真做事的侧脸，安静又好看。',
  '我喜欢你偶尔的小迷糊，让我觉得你很真实。',
  '我喜欢你说话时的语气，温柔得让人想靠近。',
  '我喜欢你在我难过时，什么都不问就陪着我。',
  '我喜欢你，不是因为你完美，而是因为你就是你。'
];

/* ③ 结尾文案 */
const FINAL_TEXT = '从今天起，你就是我的女朋友啦<br>这些理由，我会用一辈子慢慢讲给你听。';
const DATE_SUFFIX = ' · 我们在一起的第一天';

/* ④ 「再想想」按钮文案 */
const NO_TEXTS = [
  '再想想', '真的不再想想？', '确定吗…',
  '我会难过的', '再考虑一下嘛', '点旁边那个吧', '没得选啦 😝'
];
/* ========================================================= */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- 背景音乐 ---------------- */
const bgm = $('bgm');
const musicBtn = $('musicBtn');
let musicOn = false;

function setMusicUI() {
  musicBtn.classList.toggle('off', !musicOn);
  musicBtn.textContent = musicOn ? '♪' : '♪';
}

function tryPlayMusic() {
  if (musicOn) return;
  bgm.volume = 0;
  const p = bgm.play();
  if (p && p.then) {
    p.then(() => {
      musicOn = true;
      setMusicUI();
      // 淡入
      let v = 0;
      const fade = setInterval(() => {
        v += 0.02;
        if (v >= 0.35) { v = 0.35; clearInterval(fade); }
        bgm.volume = v;
      }, 80);
    }).catch(() => {
      musicOn = false;
      setMusicUI();
    });
  }
}

musicBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (musicOn) {
    bgm.pause();
    musicOn = false;
    setMusicUI();
  } else {
    tryPlayMusic();
  }
});

/* ---------------- 背景爱心粒子 ---------------- */
const cvs = $('bg');
const ctx = cvs.getContext('2d');
let W = 0, H = 0;

const HEART_PATH = new Path2D();
(function buildHeart() {
  for (let i = 0; i <= Math.PI * 2 + 0.05; i += 0.05) {
    const x = 16 * Math.pow(Math.sin(i), 3);
    const y = -(13 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i));
    i === 0 ? HEART_PATH.moveTo(x, y) : HEART_PATH.lineTo(x, y);
  }
  HEART_PATH.closePath();
})();

function drawHeart(x, y, size, color, rot) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const s = size / 32;
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.fill(HEART_PATH);
  ctx.restore();
}

let parts = [];
function newPart(randomY) {
  return {
    x: Math.random() * W,
    y: randomY ? Math.random() * H : H + 50,
    size: 8 + Math.random() * 20,
    vy: 0.25 + Math.random() * 0.9,
    vx: (Math.random() - 0.5) * 0.35,
    ph: Math.random() * Math.PI * 2,
    amp: 0.2 + Math.random() * 0.6,
    tw: 0.5 + Math.random() * 1.6,
    rot: (Math.random() - 0.5) * 0.7,
    a: 0.10 + Math.random() * 0.42,
    hue: 320 + Math.random() * 50
  };
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = W * dpr;
  cvs.height = H * dpr;
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const n = Math.max(18, Math.min(40, Math.round(W * H / 20000)));
  parts = [];
  for (let i = 0; i < n; i++) parts.push(newPart(true));
}

let last = 0;
function tick(t) {
  const dt = Math.min((t - last) / 16.67, 3) || 1;
  last = t;
  const time = t * 0.001;
  ctx.clearRect(0, 0, W, H);
  for (const p of parts) {
    p.y -= p.vy * dt;
    p.x += (p.vx + Math.sin(time * p.tw + p.ph) * p.amp) * dt;
    if (p.y < -60) Object.assign(p, newPart(false));
    if (p.x < -70) p.x = W + 70;
    if (p.x > W + 70) p.x = -70;
    drawHeart(p.x, p.y, p.size, `hsla(${p.hue},95%,72%,${p.a})`, p.rot);
  }
  requestAnimationFrame(tick);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(tick);

/* ---------------- 打字机 ---------------- */
async function typeLine(el, text, speed) {
  el.classList.add('typing');
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    await sleep(speed);
  }
  el.classList.remove('typing');
}

/* ---------------- 主流程 ---------------- */
let started = false;

async function startFlow() {
  if (started) return;
  started = true;

  tryPlayMusic();

  /* 1. 收起开场 */
  const intro = $('intro');
  intro.classList.remove('in');
  intro.classList.add('out');
  await sleep(650);

  /* 2. 先打字铺垫 */
  const reasonsScene = $('reasons');
  reasonsScene.classList.add('in');

  const tempBox = document.createElement('div');
  tempBox.style.cssText = 'width:100%;max-width:520px;margin-bottom:30px;';
  reasonsScene.appendChild(tempBox);

  for (const line of LINES) {
    const el = document.createElement('p');
    el.className = 'reason';
    el.style.marginBottom = '18px';
    const txt = document.createElement('div');
    txt.className = 'txt';
    el.appendChild(txt);
    tempBox.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    await typeLine(txt, line.t, line.s);
    await sleep(line.p);
  }

  await sleep(900);

  /* 3. 淡出铺垫，逐条浮现理由 */
  tempBox.style.transition = 'opacity .8s';
  tempBox.style.opacity = '0';
  await sleep(800);
  tempBox.remove();

  for (let i = 0; i < REASONS.length; i++) {
    const el = document.createElement('div');
    el.className = 'reason';
    el.innerHTML = `
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <div class="txt">${REASONS[i]}</div>
      <div class="line"></div>
    `;
    reasonsScene.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    await sleep(1700);
  }

  await sleep(1400);

  /* 4. 切换到提问 */
  reasonsScene.classList.remove('in');
  reasonsScene.classList.add('out');
  await sleep(700);

  $('question').classList.add('in');
}

$('intro').addEventListener('pointerdown', startFlow);
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') startFlow();
});

/* ---------------- 「再想想」 ---------------- */
const noBtn = $('no');
const yesBtn = $('yes');
let noCount = 0;

noBtn.addEventListener('click', () => {
  noCount++;
  noBtn.textContent = NO_TEXTS[Math.min(noCount, NO_TEXTS.length - 1)];
  const noScale = Math.max(0.28, 1 - noCount * 0.14);
  noBtn.style.transform = `scale(${noScale})`;
  noBtn.style.opacity = String(Math.max(0.2, 1 - noCount * 0.14));
  const yesScale = 1 + Math.min(noCount * 0.11, 0.6);
  yesBtn.style.transform = `scale(${yesScale})`;
  if (noCount >= 6) {
    noBtn.style.opacity = '0';
    noBtn.style.pointerEvents = 'none';
  }
});

/* ---------------- 「愿意」 ---------------- */
yesBtn.addEventListener('click', async () => {
  const q = $('question');
  q.classList.remove('in');
  q.classList.add('out');

  burstHearts();
  await sleep(450);
  q.style.display = 'none';

  const d = new Date();
  $('dateLine').textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日${DATE_SUFFIX}`;
  $('finalText').innerHTML = FINAL_TEXT;

  $('final').classList.add('in');
  setTimeout(burstHearts, 700);
});

/* ---------------- 爱心爆炸 ---------------- */
const CHARS = ['❤', '💕', '💖', '💗', '✨', '🌸'];
function burstHearts() {
  for (let i = 0; i < 46; i++) {
    const el = document.createElement('span');
    el.className = 'burst';
    el.textContent = CHARS[(Math.random() * CHARS.length) | 0];
    const ang = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 280;
    el.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.style.fontSize = (12 + Math.random() * 26) + 'px';
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    el.style.left = (50 + (Math.random() - 0.5) * 16) + '%';
    el.style.top = (50 + (Math.random() - 0.5) * 16) + '%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
}
</script>
</body>
</html>
